name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # The backend the proxy routes call. Without this, src/lib/api/config.ts
          # silently falls back to the old .NET API at nammakutiraweb — a wrong
          # backend rather than a failed build, which is far harder to notice.
          API_BASE_URL: https://bb-api-prd.azurewebsites.net

          # Inlined into the client bundle at build time, so they must be set
          # here; SWA application settings are read at runtime and come too late.
          NEXT_PUBLIC_APP_NAME: "Bharat Bhoomi-99"
          NEXT_PUBLIC_APP_URL: https://www.bharatbhoomi99.com

          # Read by next.config.js remotePatterns at build time. next/image
          # refuses any host not listed, and a mismatch shows up as a blank
          # image with a 400 rather than anything resembling a config error.
          BLOB_HOST: bbmedia001prd.blob.core.windows.net

          NEXTAUTH_URL: https://www.bharatbhoomi99.com
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

          # Shared bootstrap secret. Must stay identical to BB_ADMIN_KEY on
          # bb-api-prd, which compares it in routes/team.ts.
          BB_ADMIN_KEY: ${{ secrets.BB_ADMIN_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_MUD_019734F00 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "." # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
